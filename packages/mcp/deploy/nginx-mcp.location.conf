# api.staddress.com の server { } 内に追加する。
# Smithery / Claude の URL は https://api.staddress.com/mcp
#
# 反映: sudo nginx -t && sudo systemctl reload nginx

location = /mcp {
    proxy_pass http://127.0.0.1:8787/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Api-Key $http_x_api_key;
    proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
    proxy_set_header Mcp-Session-Id $http_mcp_session_id;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
}

location = /health {
    proxy_pass http://127.0.0.1:8787/health;
}

location = /.well-known/mcp/server-card.json {
    proxy_pass http://127.0.0.1:8787/.well-known/mcp/server-card.json;
}

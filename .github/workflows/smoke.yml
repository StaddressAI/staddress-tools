name: smoke

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  powershell:
    name: PowerShell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path .\examples\powershell\staddress.ps1).Path, [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { $_.Message }; exit 1 }
          Write-Host "Windows PowerShell 5.1 syntax OK"

      - name: Syntax check (pwsh 7)
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./examples/powershell/staddress.ps1).Path, [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { $_.Message }; exit 1 }
          Write-Host "pwsh 7 syntax OK"

      - name: Static analysis (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = Invoke-ScriptAnalyzer -Path ./examples/powershell/staddress.ps1 -Severity Error,Warning
          $issues | Format-Table -AutoSize
          if ($issues | Where-Object { $_.Severity -eq 'Error' }) {
            Write-Error "PSScriptAnalyzer reported errors"
            exit 1
          }

      - name: Help smoke (pwsh 7)
        shell: pwsh
        run: ./examples/powershell/staddress.ps1 -Help

      - name: Help smoke (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\examples\powershell\staddress.ps1 -Help

      - name: Live API smoke (optional, requires secret)
        shell: pwsh
        env:
          STADDRESS_API_KEY: ${{ secrets.STADDRESS_API_KEY }}
          STADDRESS_BASE_URL: ${{ secrets.STADDRESS_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STADDRESS_API_KEY)) {
            Write-Host "STADDRESS_API_KEY secret not set; skipping live test"
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:STADDRESS_BASE_URL)) {
            $env:STADDRESS_BASE_URL = 'https://api.staddress.com'
          }
          ./examples/powershell/staddress.ps1 -Usage

  cli:
    name: shell CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            if command -v brew >/dev/null 2>&1; then brew install jq; else sudo apt-get update && sudo apt-get install -y jq; fi
          fi
          jq --version

      - name: Bash syntax check
        run: |
          for f in packages/cli/bin/staddress packages/cli/lib/*.sh packages/cli/install.sh packages/cli/tests/run.sh; do
            bash -n "$f"
          done
          echo "bash syntax OK"

      - name: ShellCheck (non-blocking)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -e SC1090,SC1091 packages/cli/bin/staddress packages/cli/lib/*.sh packages/cli/install.sh || true
          else
            echo "shellcheck not available; skipping"
          fi

      - name: Unit tests (mocked curl)
        run: ./packages/cli/tests/run.sh

      - name: Install smoke
        run: |
          ./packages/cli/install.sh --prefix "$HOME/.local/bin"
          "$HOME/.local/bin/staddress" version

  node:
    name: Node.js SDK (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/node/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mcp:
    name: MCP server (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync (dev)
        run: uv sync --extra dev --python ${{ matrix.python }}

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q

      - name: Build
        run: uv build

  ruby:
    name: Ruby Gem (${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3"]
    defaults:
      run:
        working-directory: packages/ruby
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: packages/ruby

      - name: RSpec
        run: bundle exec rspec

      - name: Gem build
        run: gem build staddress.gemspec

  curl:
    name: curl sample (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          bash -n examples/curl/_common.sh
          bash -n examples/curl/staddress.sh
          echo "bash syntax OK"

      - name: ShellCheck (non-blocking)
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck examples/curl/staddress.sh examples/curl/_common.sh || true
          else
            echo "shellcheck not available; skipping"
          fi

      - name: Help smoke
        run: |
          chmod +x examples/curl/staddress.sh
          ./examples/curl/staddress.sh -h

      - name: Live API smoke (optional, requires secret)
        env:
          STADDRESS_API_KEY: ${{ secrets.STADDRESS_API_KEY }}
          STADDRESS_BASE_URL: ${{ secrets.STADDRESS_BASE_URL }}
        run: |
          if [ -z "${STADDRESS_API_KEY}" ]; then
            echo "STADDRESS_API_KEY secret not set; skipping live test"
            exit 0
          fi
          export STADDRESS_BASE_URL="${STADDRESS_BASE_URL:-https://api.staddress.com}"
          ./examples/curl/staddress.sh -u
